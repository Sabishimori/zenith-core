<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zenith — Concept v2 (superseded)</title>
    <meta
      name="description"
      content="Zenith is a concept for a community-first gaming platform. Multiplayer is very good at finding you a match, and terrible at helping you keep the people in it."
    />
    <link rel="icon" href="/img/mark.webp" type="image/webp" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500&display=swap"
      rel="stylesheet"
    />

    <script>
      /* Apply the stored theme before first paint so the page never flashes
         the wrong ground on the way in. */
      try {
        var t = localStorage.getItem('zenith-theme');
        if (t) document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
